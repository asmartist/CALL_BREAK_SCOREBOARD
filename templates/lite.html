<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Break Lite Calculator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070c;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.07);
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --secondary: #f472b6;
            --accent: #34d399;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #f87171;
            --glass-blur: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.25s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 5% 5%, rgba(129, 140, 248, 0.12) 0%, transparent 35%),
                radial-gradient(circle at 95% 95%, rgba(244, 114, 182, 0.12) 0%, transparent 35%);
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #c7d2fe 0%, #818cf8 60%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sync-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .sync-btn:hover {
            background: rgba(129, 140, 248, 0.15);
            border-color: var(--primary);
        }

        .sync-btn.pending {
            border-color: var(--secondary);
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(244, 114, 182, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0); }
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            backdrop-filter: blur(var(--glass-blur));
            padding: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #c7d2fe;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.2rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .calc-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .player-row {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .player-row-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .score-display {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .score-display.negative {
            color: var(--danger);
        }

        .controls-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .counter-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-btn:hover {
            background: var(--primary);
        }

        .counter-val {
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 1.2rem;
            text-align: center;
        }

        .blind-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .blind-btn.active {
            background: rgba(244, 114, 182, 0.12);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .round-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .round-nav button {
            width: auto;
            padding: 0.5rem 1rem;
        }

        .hidden {
            display: none !important;
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #111827;
            border: 1px solid var(--card-border);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <h1>Call Break Lite</h1>
        <button id="sync-button" class="sync-btn" onclick="syncLocalData()">
            <span id="sync-status-dot" style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent);"></span>
            <span id="sync-text">Synced</span>
        </button>
    </header>

    <div class="container">

        <!-- Setup Screen -->
        <div class="glass-panel" id="setup-panel">
            <h2>Start Local Calculator</h2>
            <div class="calc-grid" style="margin-top: 1rem;">
                <div class="grid-2">
                    <div class="input-group">
                        <label>Player 1</label>
                        <input type="text" id="p1" value="Player 1">
                    </div>
                    <div class="input-group">
                        <label>Player 2</label>
                        <input type="text" id="p2" value="Player 2">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="input-group">
                        <label>Player 3</label>
                        <input type="text" id="p3" value="Player 3">
                    </div>
                    <div class="input-group">
                        <label>Player 4</label>
                        <input type="text" id="p4" value="Player 4">
                    </div>
                </div>
                <button class="btn btn-primary" onclick="initCalculator()">Initialize Game</button>
            </div>
        </div>

        <!-- Calculator Screen -->
        <div class="glass-panel hidden" id="calc-panel">
            <h2>
                <span id="round-indicator">Round 1</span>
                <span id="trump-label" style="font-size: 0.85rem; font-weight: 400; color: var(--text-muted);">Trump: Spades ♠</span>
            </h2>

            <div class="calc-grid" id="players-calc-rows">
                <!-- Rows injected dynamically -->
            </div>

            <div class="round-nav">
                <button class="btn btn-secondary" onclick="prevRound()">← Prev</button>
                <button class="btn btn-secondary" onclick="resetGame()" style="font-size: 0.85rem;">Reset All</button>
                <button class="btn btn-primary" onclick="nextRound()" id="next-btn">Next Round →</button>
            </div>
        </div>

    </div>

    <div class="toast" id="toast">Message</div>

    <script>
        let gameState = {
            id: null,
            status: 'PLAYING',
            version: 1,
            trump_suit: 'Spades ♠',
            players: [],
            rounds: [],
            current_round_index: 0
        };

        window.onload = function() {
            checkLocalGame();
            updateSyncButtonUI();
        };

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = type === 'success' ? 'var(--accent)' : 'var(--danger)';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function checkLocalGame() {
            const saved = localStorage.getItem('cb_lite_game');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('setup-panel').classList.add('hidden');
                document.getElementById('calc-panel').classList.remove('hidden');
                renderRound();
            }
        }

        function saveLocal() {
            localStorage.setItem('cb_lite_game', JSON.stringify(gameState));
            updateSyncButtonUI();
        }

        function updateSyncButtonUI() {
            const syncBtn = document.getElementById('sync-button');
            const dot = document.getElementById('sync-status-dot');
            const text = document.getElementById('sync-text');
            const unsynced = localStorage.getItem('cb_lite_unsynced') === 'true';

            if (unsynced) {
                syncBtn.classList.add('pending');
                dot.style.background = 'var(--secondary)';
                text.textContent = 'Sync Cloud';
            } else {
                syncBtn.classList.remove('pending');
                dot.style.background = 'var(--accent)';
                text.textContent = 'Synced';
            }
        }

        function initCalculator() {
            gameState.id = crypto.randomUUID();
            gameState.status = 'PLAYING';
            gameState.version = 1;
            gameState.current_round_index = 0;
            
            const names = [
                document.getElementById('p1').value.trim() || 'Player 1',
                document.getElementById('p2').value.trim() || 'Player 2',
                document.getElementById('p3').value.trim() || 'Player 3',
                document.getElementById('p4').value.trim() || 'Player 4'
            ];

            gameState.players = names.map((name, idx) => ({
                id: crypto.randomUUID(),
                name: name,
                seat_no: idx + 1
            }));

            gameState.rounds = Array.from({ length: 13 }, (_, idx) => ({
                id: crypto.randomUUID(),
                round_no: idx + 1,
                status: 'BIDDING',
                locked: false,
                bids_locked: false,
                trump_card: 'Spades',
                bids: gameState.players.map(p => ({ player_id: p.id, bid: 2, is_blind: false })),
                results: gameState.players.map(p => ({ player_id: p.id, tricks_won: 0, score: "0.00" }))
            }));

            document.getElementById('setup-panel').classList.add('hidden');
            document.getElementById('calc-panel').classList.remove('hidden');
            
            saveLocal();
            localStorage.setItem('cb_lite_unsynced', 'true');
            renderRound();
        }

        function renderRound() {
            const round = gameState.rounds[gameState.current_round_index];
            document.getElementById('round-indicator').textContent = `Round ${round.round_no} / 13`;
            
            const container = document.getElementById('players-calc-rows');
            container.innerHTML = '';

            gameState.players.forEach((player, idx) => {
                const bidObj = round.bids.find(b => b.player_id === player.id);
                const resObj = round.results.find(r => r.player_id === player.id);
                const totalScore = calculateCumulativeScore(player.id, gameState.current_round_index);

                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
                    <div class="player-row-header">
                        <span class="player-name">${player.name}</span>
                        <span class="score-display ${totalScore < 0 ? 'negative' : ''}">Total: ${totalScore.toFixed(2)}</span>
                    </div>
                    <div class="controls-wrap">
                        <div class="control-item">
                            <span style="font-size: 0.8rem; color: var(--text-muted); margin-right: 0.3rem;">Bid:</span>
                            <button class="counter-btn" onclick="adjustBid(${idx}, -1)">-</button>
                            <span class="counter-val">${bidObj.bid}</span>
                            <button class="counter-btn" onclick="adjustBid(${idx}, 1)">+</button>
                            <button class="blind-btn ${bidObj.is_blind ? 'active' : ''}" onclick="toggleBlind(${idx})">Blind</button>
                        </div>
                        <div class="control-item">
                            <span style="font-size: 0.8rem; color: var(--text-muted); margin-right: 0.3rem;">Won:</span>
                            <button class="counter-btn" onclick="adjustTricks(${idx}, -1)">-</button>
                            <span class="counter-val">${resObj.tricks_won}</span>
                            <button class="counter-btn" onclick="adjustTricks(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });

            const nextBtn = document.getElementById('next-btn');
            if (gameState.current_round_index === 12) {
                nextBtn.textContent = 'Finish Game';
            } else {
                nextBtn.textContent = 'Next Round →';
            }
        }

        function calculateCumulativeScore(playerId, upToRoundIndex) {
            let sum = 0.0;
            for (let i = 0; i <= upToRoundIndex; i++) {
                const round = gameState.rounds[i];
                const res = round.results.find(r => r.player_id === playerId);
                if (res) {
                    sum += parseFloat(res.score || 0);
                }
            }
            return sum;
        }

        function adjustBid(playerIdx, delta) {
            const round = gameState.rounds[gameState.current_round_index];
            const pId = gameState.players[playerIdx].id;
            const bidObj = round.bids.find(b => b.player_id === pId);
            
            bidObj.bid = Math.max(bidObj.is_blind ? 5 : 2, Math.min(13, bidObj.bid + delta));
            recalculateRoundScores();
            saveLocal();
            localStorage.setItem('cb_lite_unsynced', 'true');
            renderRound();
        }

        function toggleBlind(playerIdx) {
            const round = gameState.rounds[gameState.current_round_index];
            const pId = gameState.players[playerIdx].id;
            const bidObj = round.bids.find(b => b.player_id === pId);
            
            bidObj.is_blind = !bidObj.is_blind;
            if (bidObj.is_blind && bidObj.bid < 5) {
                bidObj.bid = 5;
            }
            recalculateRoundScores();
            saveLocal();
            localStorage.setItem('cb_lite_unsynced', 'true');
            renderRound();
        }

        function adjustTricks(playerIdx, delta) {
            const round = gameState.rounds[gameState.current_round_index];
            const pId = gameState.players[playerIdx].id;
            const resObj = round.results.find(r => r.player_id === pId);
            
            resObj.tricks_won = Math.max(0, Math.min(13, resObj.tricks_won + delta));
            recalculateRoundScores();
            saveLocal();
            localStorage.setItem('cb_lite_unsynced', 'true');
            renderRound();
        }

        function recalculateRoundScores() {
            const round = gameState.rounds[gameState.current_round_index];
            round.results.forEach(res => {
                const bidObj = round.bids.find(b => b.player_id === res.player_id);
                const scoreVal = clientCalculateScore(bidObj.bid, res.tricks_won, bidObj.is_blind);
                res.score = scoreVal.toFixed(2);
            });
        }

        function clientCalculateScore(bid, tricks, isBlind) {
            let score = 0;
            if (tricks >= bid) {
                let extra = tricks - bid;
                let effectiveExtra = Math.min(extra, 2);
                score = (bid * 10) + (effectiveExtra * 1);
                if (isBlind) {
                    score *= 2;
                }
            } else {
                score = -bid * 10;
            }
            if (tricks === 8) {
                score *= 2;
            }
            return score;
        }

        function prevRound() {
            if (gameState.current_round_index > 0) {
                gameState.current_round_index--;
                saveLocal();
                renderRound();
            }
        }

        function nextRound() {
            const round = gameState.rounds[gameState.current_round_index];
            const tricksSum = round.results.reduce((s, r) => s + r.tricks_won, 0);

            if (tricksSum !== 13) {
                showToast(`Total tricks won must be exactly 13 (current sum is ${tricksSum}).`, 'error');
                return;
            }

            round.locked = true;
            round.bids_locked = true;
            round.status = 'COMPLETE';

            if (gameState.current_round_index < 12) {
                gameState.current_round_index++;
                gameState.rounds[gameState.current_round_index].status = 'BIDDING';
                saveLocal();
                renderRound();
            } else {
                gameState.status = 'MATCH_COMPLETE';
                gameState.completed_at = new Date().toISOString();
                saveLocal();
                showToast("Game Complete! Click Sync to back up your scores to the server.");
                renderRound();
            }
        }

        function resetGame() {
            if (confirm("Are you sure you want to clear this local calculator session?")) {
                localStorage.removeItem('cb_lite_game');
                localStorage.removeItem('cb_lite_unsynced');
                gameState = {
                    id: null,
                    status: 'PLAYING',
                    version: 1,
                    trump_suit: 'Spades ♠',
                    players: [],
                    rounds: [],
                    current_round_index: 0
                };
                document.getElementById('calc-panel').classList.add('hidden');
                document.getElementById('setup-panel').classList.remove('hidden');
                updateSyncButtonUI();
            }
        }

        async function syncLocalData() {
            const saved = localStorage.getItem('cb_lite_game');
            if (!saved) {
                showToast("No active local match data to sync.", "error");
                return;
            }

            const data = JSON.parse(saved);
            
            // Increment version before syncing to signify local updates
            data.version = (data.version || 1) + 1;

            try {
                const response = await fetch('/api/matches/sync/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errRes = await response.json();
                    throw new Error(errRes.errors?.[0]?.error || "Sync failed");
                }

                const result = await response.json();
                
                if (result.synced && result.synced.length > 0) {
                    const syncDetails = result.synced[0];
                    if (syncDetails.status === 'skipped') {
                        showToast(`Server has a newer version. Sync skipped.`, "error");
                    } else {
                        showToast("Successfully synced to the server cloud!");
                        gameState.version = syncDetails.version;
                        saveLocal();
                        localStorage.removeItem('cb_lite_unsynced');
                        updateSyncButtonUI();
                    }
                }
            } catch (err) {
                showToast(err.message, "error");
            }
        }
    </script>
</body>
</html>
