<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Break Companion - Match Completed</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --glass-blur: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: blur(var(--glass-blur));
            padding: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.8s ease;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #a5b4fc;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--accent) 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .export-group {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        /* Tables & badges styling */
        .table-responsive {
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 0.8rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            font-weight: 600;
            color: #a5b4fc;
            font-size: 0.9rem;
        }

        td {
            font-size: 0.95rem;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media(max-width: 768px) {
            h1 {
                font-size: 2.4rem;
            }
            .glass-panel {
                padding: 1.5rem;
            }
        }

        @media(max-width: 480px) {
            h1 {
                font-size: 2rem;
            }
            p.subtitle {
                font-size: 0.95rem;
            }
            .glass-panel {
                padding: 1.2rem;
                border-radius: 15px;
            }
            body {
                padding: 1rem 0.5rem;
            }
            .btn {
                padding: 0.7rem 1.2rem;
                font-size: 0.95rem;
                width: 100%;
            }
            .export-group {
                flex-direction: column;
                align-items: stretch;
            }
            .export-group .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Call Break Companion</h1>
        <p class="subtitle">Lightweight Score Tracker</p>
    </header>

    <div class="container">
        
        <main class="glass-panel" id="complete-panel">
            <h2 style="color: var(--accent);">Match Complete!</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">All 13 rounds finished. Final score sheets and cumulative stats are calculated below.</p>
            
            <div class="table-responsive">
                <table id="final-scores-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Seat</th>
                            <th>Total Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Standings loaded dynamically -->
                    </tbody>
                </table>
            </div>

            <div class="export-group">
                <a class="btn btn-primary" id="export-json-btn" target="_blank">Export JSON</a>
                <a class="btn btn-secondary" id="export-csv-btn" target="_blank">Export CSV</a>
                <a class="btn btn-success" id="export-pdf-btn" target="_blank">Export PDF report</a>
            </div>

            <a href="/" class="btn btn-primary" style="width: 100%; margin-top: 2rem; display: flex; text-align: center;">
                Start Another Match
            </a>
        </main>

    </div>

    <script>
        const API_BASE = '/api';
        const currentMatchId = "{{ match_id }}";

        window.onload = function() {
            loadMatchStandings();
        };

        async function loadMatchStandings() {
            try {
                const response = await fetch(`${API_BASE}/matches/${currentMatchId}/`);
                if (!response.ok) throw new Error("Failed to load match details.");
                const match = await response.json();

                const tbody = document.querySelector('#final-scores-table tbody');
                tbody.innerHTML = '';

                // Sort scores descending
                const sortedScores = [...match.scores].sort((a,b) => parseFloat(b.total_score) - parseFloat(a.total_score));
                
                sortedScores.forEach((score, index) => {
                    const seatNo = match.match_players.find(p => p.player === score.player)?.seat_no || '?';
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="font-weight: bold; color: ${index === 0 ? 'var(--accent)' : 'var(--text-main)'}">${index + 1}</td>
                        <td>${score.player_name}</td>
                        <td>Seat ${seatNo}</td>
                        <td style="font-weight: 600;">${parseFloat(score.total_score).toFixed(2)}</td>
                    `;
                    tbody.appendChild(row);
                });

                // Set up export hrefs
                document.getElementById('export-json-btn').href = `${API_BASE}/matches/${currentMatchId}/export/?format=json`;
                document.getElementById('export-csv-btn').href = `${API_BASE}/matches/${currentMatchId}/export/?format=csv`;
                document.getElementById('export-pdf-btn').href = `${API_BASE}/matches/${currentMatchId}/export/?format=pdf`;
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
